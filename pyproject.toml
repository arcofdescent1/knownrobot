[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "knownrobot"
version = "1.6.0"
description = "Validate robot-policy manifests and execute reproducible local robotics simulation evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Known Robot contributors" }]
keywords = ["robotics", "lerobot", "reproducibility", "robot-policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0.1,<7", "jsonschema>=4.22,<5", "rfc3986-validator>=0.1.1,<1", "packaging>=24,<27", "tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
evaluation = ["gymnasium==1.2.3", "gymnasium-robotics==1.4.2", "mujoco==3.6.0", "numpy==2.2.6"]

[project.urls]
Homepage = "https://knownrobot.com/validator"
Repository = "https://github.com/arcofdescent1/knownrobot"
Issues = "https://github.com/arcofdescent1/knownrobot/issues"

[project.scripts]
robot-skill = "robot_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["robot_skill"]

[tool.hatch.build.targets.wheel.force-include]
"robot_skill/robot-skill.schema.json" = "robot_skill/robot-skill.schema.json"
"robot_skill/manifest-publication.rules.json" = "robot_skill/manifest-publication.rules.json"
