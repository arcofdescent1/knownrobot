name: Monthly sprint operations

on:
  schedule:
    - cron: "0 16 1 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: embodied-registry/package-lock.json
      - working-directory: embodied-registry
        run: npm ci
      - name: Reconcile next sprint selection issue
        working-directory: embodied-registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sprint:select
