name: Evidence correction or dispute
description: Request a factual correction, challenge a claim, or appeal a review with public evidence.
title: "Evidence correction/dispute: [evaluation ID]"
body:
  - type: markdown
    attributes:
      value: |
        Read https://knownrobot.com/corrections. Allegations do not automatically grant or retract verification. Private evidence, personal information and security-sensitive details must not be posted here. Published records are not silently rewritten; corrections link a new record or an attributable review/retraction.
  - type: input
    id: record
    attributes:
      label: Permanent Known Robot evaluation URL and result digest
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options: ["Factual correction", "Verification dispute", "Credit/authorship correction", "Appeal of a prior decision"]
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Exact disputed statement and requested remedy
      description: Identify the claim, what is wrong and what should change. Include the prior decision link for an appeal.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting public evidence and immutable revisions
      description: Link inspectable logs, protocol, ledger, original author credits or published records. Distinguish facts from interpretation.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public record agreement
      options:
        - label: This contains no secrets, private personal information, serial numbers or confidential facility details.
          required: true
        - label: I understand the discussion and any decision remain public and attributed, including disagreement.
          required: true
